<style>
/* Layout: una pantalla de celular con cuatro pestañas fijas abajo (Libros, Leer, Palabras, Resumen); hojas inferiores para editar. */
:root {
  --bg: #FFF6F9;
  --surface: #FFFFFF;
  --ink: #3A2A33;
  --muted: #85707B;
  --line: #F3DDE6;
  --accent: #C9487A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBDDE8;
  --good: #4E9A5E;
  --warn: #B8693F;
  --star: #E9A93C;
  --c-lav: #F6CFE0;
  --c-mint: #D3EBC3;
  --c-peach: #FBDAC8;
  --c-sky: #CBE6F7;
  --c-rose: #F7C6D6;
  --c-butter: #F6ECC3;
  --shadow: 0 6px 24px rgba(200, 90, 130, .12);
  --wood: #D9BF9C;
  --wood-hi: #EBD6B8;
  --case: #FDEBF2;
  --wall: #FFF0F5;
  --board: #FFFFFF;
  --board-edge: #F0D3DF;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F161B; --surface: #2A1F25; --ink: #F6E8EE; --muted: #BFA5B1; --line: #402F38;
    --accent: #F08FB2; --accent-ink: #3A1626; --accent-soft: #4A2C3A;
    --good: #8FD19A; --warn: #E8A57C; --star: #F0B94F;
    --c-lav: #5A3045; --c-mint: #2F4A2C; --c-peach: #5A3A2A; --c-sky: #28465A; --c-rose: #5E2F44; --c-butter: #55482A;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45); --wood: #6B5139; --wood-hi: #7E6147; --case: #241A20; --wall: #281D24; --board: #4A3641; --board-edge: #5C4350;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F161B; --surface: #2A1F25; --ink: #F6E8EE; --muted: #BFA5B1; --line: #402F38;
    --accent: #F08FB2; --accent-ink: #3A1626; --accent-soft: #4A2C3A;
    --good: #8FD19A; --warn: #E8A57C; --star: #F0B94F;
    --c-lav: #5A3045; --c-mint: #2F4A2C; --c-peach: #5A3A2A; --c-sky: #28465A; --c-rose: #5E2F44; --c-butter: #55482A;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45); --wood: #6B5139; --wood-hi: #7E6147; --case: #241A20; --wall: #281D24; --board: #4A3641; --board-edge: #5C4350;
    color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14.5px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 112px;
}
button, input, select, textarea { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; border: 0; background: none; }
input, select, textarea {
  width: 100%; font-size: 16px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 46px;
}
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.calh { text-align: center; font-size: 9.5px; font-weight: 700; color: var(--muted); }
.cd { position: relative; aspect-ratio: 2 / 3; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; padding: 0; display: block; }
.cd:not(.has) { overflow: visible; }
.trk { position: absolute; left: -3px; right: -3px; height: 6px; border-radius: 0; box-shadow: 0 0 0 1px rgba(0, 0, 0, .1); z-index: 1; }
.trk.tb { left: 30%; border-radius: 6px 0 0 6px; }
.cd.today { border-color: var(--accent); border-width: 2px; }
.cd .dn { position: absolute; top: 2px; left: 3px; font-size: 8.5px; font-weight: 700; color: var(--muted); line-height: 1; }
.cd.has { border: 0; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
.cd.has img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cd.has em { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px 2px 2px; font-style: normal; font-size: 8px; line-height: 1.1; text-align: center; overflow: hidden; font-family: var(--display); }
.cd.has .dn { color: #fff; background: rgba(0, 0, 0, .5); border-radius: 4px; padding: 2px 3px; top: 2px; left: 2px; }
.cd .more { position: absolute; right: 2px; bottom: 2px; font-size: 8.5px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 1px 4px; }
.irow { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.irow > div { overflow-wrap: anywhere; }
.rhead { margin: 14px 0 2px; font-weight: 700; font-size: 11.5px; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.slog { display: flex; flex-direction: column; }
.sday { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: 11.5px; color: var(--muted); }
.sday b { color: var(--ink); font-family: var(--display); font-weight: 400; font-size: 13.5px; }
.sday i { flex: 1; border-top: 1.5px dashed var(--line); min-width: 12px; }
.sitem { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 2px 4px; }
.sdur { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; }
.sdur svg { color: var(--accent); flex: none; }
.spg { margin-left: 22px; font-size: 12.5px; color: var(--muted); }
.spg b { color: var(--good); }
textarea { resize: none; min-height: 84px; overflow: hidden; }
input, select, textarea { min-width: 0; max-width: 100%; display: block; }
input[type="date"], input[type="time"], input[type="number"], input[type="search"] { -webkit-appearance: none; appearance: none; text-align: left; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; min-width: 0; }
select { text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
.field, .grid2 > *, .stack > * { min-width: 0; }
.grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#sheet .panel { overflow-x: hidden; }
#sheet .panel > * { max-width: 100%; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 28.5px; line-height: 1.1; margin: 14px 0 4px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 18.5px; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 13.5px; }
.label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 700; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.danger { background: transparent; color: var(--warn); border: 1.5px solid var(--line); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 600; font-size: 12.5px; color: var(--muted); background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.book { display: flex; gap: 12px; text-align: left; width: 100%; padding: 12px; }
.spine { flex: none; width: 46px; height: 64px; border-radius: 8px 12px 12px 8px; display: grid; place-items: center; font-family: var(--display); font-size: 20.5px; color: var(--ink); box-shadow: inset 5px 0 0 rgba(0,0,0,.08); }
.c-lav { background: var(--c-lav); } .c-mint { background: var(--c-mint); } .c-peach { background: var(--c-peach); }
.c-sky { background: var(--c-sky); } .c-rose { background: var(--c-rose); } .c-butter { background: var(--c-butter); }
.btitle { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.bauthor { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meta { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.stars { display: inline-flex; gap: 2px; }
.stars button { font-size: 22.5px; line-height: 1; padding: 6px 3px; color: var(--line); min-width: 36px; min-height: 40px; }
.stars button.on { color: var(--star); }
.stars.small { pointer-events: none; }
.stars.small button, .stars i { font-size: 12.5px; padding: 0 1px; min-width: 0; min-height: 0; font-style: normal; line-height: 1; color: var(--line); }
.stars i.on { color: var(--star); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 5; box-shadow: var(--shadow); }
.note { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.note button { font-weight: 700; color: var(--accent); min-height: 36px; padding: 0 4px; flex: none; }
.empty { text-align: center; padding: 34px 12px; color: var(--muted); }
.empty b { display: block; font-family: var(--display); font-weight: 400; font-size: 18.5px; color: var(--ink); margin-bottom: 4px; }
/* tab bar */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(10px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-right, 0px)); }
#tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; font-size: 10px; font-weight: 700; color: var(--muted); border-radius: 12px; position: relative; }
#tabs button[aria-current="page"] { color: var(--accent); }
#tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabs .dot { position: absolute; top: 6px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 50%; background: var(--warn); border: 2px solid var(--surface); }
/* timer */
.clockbox { text-align: center; padding: 26px 12px 20px; }
.clock { font-family: var(--mono); font-weight: 500; font-size: 56.5px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.clock.paused { color: var(--muted); }
.pulse { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--good); margin-right: 6px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
/* sheet */
#sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: rgba(20, 14, 34, .45); }
#sheet .panel { width: 100%; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 14px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); box-shadow: var(--shadow); }
#sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; }
.sw[aria-pressed="true"] { border-color: var(--accent); }
.def { margin: 6px 0; overflow-wrap: anywhere; }
.word { font-family: var(--display); font-size: 22.5px; line-height: 1.15; overflow-wrap: anywhere; }
.x { color: var(--muted); min-width: 40px; min-height: 40px; font-size: 16.5px; flex: none; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; }
.bars div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 10.5px; color: var(--muted); }
.bars i { display: block; width: 100%; min-height: 4px; background: var(--accent); border-radius: 8px 8px 4px 4px; }
.bars div.today { color: var(--ink); font-weight: 700; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi b { display: block; font-family: var(--display); font-weight: 400; font-size: 26.5px; line-height: 1.1; font-variant-numeric: tabular-nums; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 12.5px; font-weight: 600; max-width: 90%; text-align: center; }
/* librero */
.seg { display: flex; background: var(--accent-soft); border-radius: 13px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; min-height: 38px; border-radius: 10px; font-weight: 700; font-size: 12.5px; color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 4px rgba(190, 80, 120, .18); }
.case { position: relative; background-color: var(--case); border: 10px solid var(--wood); border-radius: 16px; padding: 14px 8px 0;
  background-image: repeating-linear-gradient(90deg, transparent 0 22px, rgba(130, 110, 170, .07) 22px 23px);
  box-shadow: inset 0 8px 16px rgba(60, 40, 90, .14), var(--shadow); overflow: hidden; }
.srow { position: relative; }
.spines { display: flex; align-items: flex-end; gap: 3px; min-height: 172px; padding: 0 4px; }
.plank { height: 15px; margin: 0 -8px; background: linear-gradient(var(--wood-hi), var(--wood)); box-shadow: 0 9px 10px -6px rgba(40, 25, 10, .35); border-radius: 2px; }
.sp { position: relative; flex: none; display: flex; justify-content: center; border-radius: 3px 3px 1px 1px; overflow: visible; color: var(--ink);
  box-shadow: inset 3px 0 0 rgba(255, 255, 255, .35), inset -3px 0 0 rgba(0, 0, 0, .09), 0 1px 0 rgba(0, 0, 0, .12); }
.sp::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: rgba(0, 0, 0, .14); }
.sp .st { display: block; height: 100%; padding: 16px 0 10px; writing-mode: vertical-rl; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--display); font-size: 11.5px; line-height: 1.1; }
.sp .pg { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, .10); border-radius: 0 0 1px 1px; pointer-events: none; }
.sp.reading { transform: translateY(-9px); }
.sp.reading::after { content: ""; position: absolute; top: -7px; right: 7px; width: 7px; height: 20px; background: var(--warn); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
.decor { margin-left: auto; align-self: flex-end; flex: none; padding-right: 2px; }
.shelf-empty { position: absolute; left: 14px; right: 14px; top: 38px; text-align: center; color: var(--muted); font-size: 12.5px; z-index: 1; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 14px 8px; }
.gc { text-align: left; min-width: 0; }
.cov { aspect-ratio: 2 / 3; max-width: 100%; border-radius: 5px 10px 10px 5px; overflow: hidden; box-shadow: var(--shadow), inset 4px 0 0 rgba(0, 0, 0, .08); display: grid; place-items: center; padding: 8px; text-align: center; font-family: var(--display); font-size: 12.5px; line-height: 1.2; overflow-wrap: anywhere; }
.cov img { width: 100%; height: 100%; object-fit: cover; display: block; margin: -8px; width: calc(100% + 16px); height: calc(100% + 16px); max-width: none; }
.gc .gt { font-size: 11.5px; font-weight: 600; line-height: 1.25; margin-top: 7px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.coverrow { display: flex; gap: 14px; align-items: center; }
.coverrow .cov { width: 84px; flex: none; font-size: 10.5px; padding: 6px; }
.coverrow .cov img { margin: -6px; width: calc(100% + 12px); height: calc(100% + 12px); }
.msg { font-size: 11.5px; color: var(--muted); margin: 0; }
.rgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.rc { padding: 10px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.tile { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 12px; display: grid; place-items: center; overflow: hidden; padding: 10px; text-align: center; font-family: var(--display); font-size: 13.5px; line-height: 1.2; overflow-wrap: anywhere; }

.rt { font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rc .btn { min-height: 44px; padding: 0 10px; font-size: 12.5px; }
.btn.icon { width: 46px; padding: 0; flex: none; }
.tile.has { aspect-ratio: 2 / 3; padding: 0; background: none; border-radius: 4px 9px 9px 4px; box-shadow: 0 4px 12px rgba(0, 0, 0, .22); }
.tile.has img { width: 100%; height: 100%; max-width: none; object-fit: cover; border-radius: inherit; box-shadow: none; display: block; }
.rbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.rbtns .btn { min-height: 34px; padding: 0; border-radius: 10px; }
.rbtns .btn svg { width: 17px; height: 17px; }
.gc { display: block; width: 100%; }
#tabs button { font-size: 9.5px; }
/* biblioteca por año: repisas flotantes */
.ysec { margin-bottom: 26px; }
.yhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; padding: 0 2px; }
.ynum { font-family: var(--display); font-size: 28.5px; line-height: 1; }
.wall { position: relative; background: var(--wall); border-radius: 18px; padding-top: 16px; overflow: hidden; }
.wall::after { content: ""; display: block; height: 22px; }
.wall::before { display: none; content: ""; position: absolute; inset: -24px; z-index: 0; filter: blur(9px) saturate(.85); opacity: .85; pointer-events: none;
  background:
    radial-gradient(circle at 76% 30%, rgba(255, 236, 190, .95) 0 7%, rgba(255, 236, 190, 0) 22%),
    radial-gradient(120% 55% at 18% 108%, #b4dba5 0 55%, transparent 56%),
    radial-gradient(130% 50% at 88% 112%, #9ccf8d 0 55%, transparent 56%),
    radial-gradient(90% 40% at 50% 100%, #d4e7c4 0 60%, transparent 61%),

.ysec:nth-of-type(3n+2) .wall::before {
  background:
    radial-gradient(circle at 24% 26%, rgba(255, 245, 225, .95) 0 6%, rgba(255, 245, 225, 0) 20%),

    ui.loading = true; ui.err = ""; ui.result = null; ui.q = q; render();
    var prompt = 'Eres un diccionario para una persona que lee libros en español. Palabra o expresión: "' + q.replace(/"/g, "'") + '".\n' +
      'Responde solo con un objeto JSON con estas claves: "palabra" (forma de diccionario), "idioma" (idioma de la palabra), "tipo" (sustantivo, verbo, adjetivo, etc.), "definicion" (definición clara y breve, en español), "ejemplo" (una oración corta de ejemplo), "sinonimos" (lista de hasta 4 palabras), "traduccion" (si la palabra no es española, su traducción al español; si lo es, cadena vacía). ' +
      'Si no es una palabra o expresión real, responde {"error":"explicación breve en español"}.';
    sample.json(prompt, { modelTier: "quick" }).then(function (r) {
      ui.loading = false;
      if (!r || r.error || !r.palabra || !r.definicion) {
        ui.err = (r && r.error) || "No encontré esa palabra. Revisa cómo está escrita.";
      } else {
        var low = String(r.palabra).toLowerCase();
        var prev = S.words.filter(function (w) { return w.bookId === bk && w.word.toLowerCase() === low; })[0], id;
        if (prev) id = prev.id;
        else {
          id = uid();
          S.words.push({ id: id, word: r.palabra, pos: r.tipo || "", def: r.definicion, tr: r.traduccion || "", ex: r.ejemplo || "", bookId: bk, ts: Date.now() });
          persist();
        }
        r.id = id; r.dup = !!prev; r.bookId = bk; ui.result = r; ui.q = "";
      }
      render();
    }).catch(function (e) {
      ui.loading = false;
      var c = e && e.code;
      ui.err = c === "not_granted" ? "No diste permiso para consultar el diccionario. Puedes guardar palabras con tu propio significado." : c === "rate_limited" ? "Demasiadas búsquedas seguidas. Intenta en un momento." : "No pude consultar ahora. Intenta de nuevo.";
      if (c === "not_granted" || c === "sampling_disabled") sample = null;
      render();
    });
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (ev) {
    var tab = ev.target.closest("[data-tab]");
    if (tab) { setTab(tab.dataset.tab); return; }
    var el = ev.target.closest("[data-act]");
    if (el) { act(el); return; }
    if (ev.target.id === "sheet") { ui.back = null; closeSheet(); render(); }
  });
  document.addEventListener("submit", function (ev) {
    if (ev.target.id === "dform") {
      ev.preventDefault();
      var q = $("#dq").value.trim();
      if (!q) return;
      if (sample) lookup(q); else { ui.q = q; ui.result = null; render(); }
    }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "msp") msHint();
    if (ev.target.id === "endp" && S.timer) { var eh = $("#endhint"), dd = (parseInt(ev.target.value, 10) || 0) - S.timer.from; if (eh) eh.textContent = dd > 0 ? "Leíste " + dd + (dd === 1 ? " página" : " páginas") + "." : "Aún no avanzas páginas."; }
    if (ev.target.tagName === "TEXTAREA" && ev.target.id !== "fgt" && ev.target.closest("#sheet")) fit(ev.target);
    if (ev.target.id === "wf") {
      ui.wordFilter = ev.target.value;
      var pos = ev.target.selectionStart; render();
      var n = $("#wf"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "msb") msHint();
    if (ev.target.id === "wbook") { ui.dictBook = ev.target.value; ui.result = null; }
    if (ev.target.id === "rsf" && ev.target.files && ev.target.files[0]) {
      var rr = new FileReader();
      rr.onerror = function () { toast("No pude leer ese archivo"); };
      rr.onload = function () {
        var p = null; try { p = JSON.parse(rr.result); } catch (er) {}
        if (p && !p.data && Array.isArray(p.books)) p = { data: p, covers: {} };
        if (!p || !p.data || !Array.isArray(p.data.books)) { toast("Ese archivo no es un respaldo del diario"); return; }
        ui.restore = p; restoreSheet(p);
      };
      rr.readAsText(ev.target.files[0]);
      ev.target.value = "";
    }
    if (ev.target.id === "cov" && ev.target.files && ev.target.files[0] && ui.edit) {
      var file = ev.target.files[0];
      readEdit();
      shrink(file, function (small, blob, col) {
        if (!ui.edit) return;
        ui.edit.coverData = small; ui.edit.coverBlob = blob; ui.edit.removeCover = false; ui.msg = "";
        if (col) { ui.edit.ccolor = col; ui.edit.spine = col; }
        bookSheet();
      });
    }
  });
  var rsT;
  window.addEventListener("resize", function () {
    clearTimeout(rsT);
    rsT = setTimeout(function () { if (ui.tab === "libros" && ui.view === "estante" && !ui.sheet) render(); }, 200);
  });

  function tick() {
    var t = S.timer, c = $("#clock");
    if (c && t) {
      c.textContent = clock(elapsed());
      c.classList.toggle("paused", !t.run);
      var l = $("#runLabel"); if (l) l.innerHTML = t.run ? '<span class="pulse"></span>Leyendo' : "En pausa";
    }
  }
  setInterval(tick, 1000);

  if (!inClaude) {
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
    window.addEventListener("beforeinstallprompt", function (ev) { ev.preventDefault(); ui.installEvt = ev; if (!ui.sheet) render(); });
    window.addEventListener("appinstalled", function () { ui.installEvt = null; toast("App instalada"); if (!ui.sheet) render(); });
  }

  render();
  if (S.timer && S.timer.run) requestWake();
  connect();
})();
</script>
</body>
</html>
